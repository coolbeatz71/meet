name: meet
description: A one page portfolio.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  responsive_framework: ^1.4.0
  smooth_page_indicator: ^1.2.0+3
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  url_launcher_web: ^2.3.3
  mailto: ^2.0.0
  font_awesome_flutter: ^10.7.0
  animated_splash_screen: ^1.3.0
  flutter_native_splash: ^2.4.1
  icons_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Quicksand
      fonts:
        - asset: fonts/Quicksand-Bold.ttf
        - asset: fonts/Quicksand-Light.ttf
        - asset: fonts/Quicksand-Medium.ttf
        - asset: fonts/Quicksand-Regular.ttf
        - asset: fonts/Quicksand-SemiBold.ttf
